<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<script>/* set the saved colour theme before the page draws, so it does not flash the other theme */try{var t=localStorage.getItem('vsb:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Kuda Villingili Villa Status Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EDF3F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: sticky bar (date + tabs) over a summary strip, then a responsive grid of section cards.
   Palette: lagoon teal on sea-glass neutrals, coral for "today". Status chips take hue from per-code tokens. */
:root{
  --bg:#EDF3F3; --surface:#FFFFFF; --surface2:#E2EBEB; --line:#CBD8D8;
  --fg:#0F2A2E; --muted:#58737A; --accent:#0B6E78; --accent-fg:#FFFFFF; --warm:#D4552A;
  --cl-bg:92%; --cl-fg:22%; --cl-bd:78%; --shadow:0 1px 2px rgba(15,42,46,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1A1D; --surface:#102529; --surface2:#17343A; --line:#26494F;
  --fg:#E4F1F0; --muted:#8FB0B3; --accent:#4FC3CC; --accent-fg:#062226; --warm:#FF8A5C;
  --cl-bg:22%; --cl-fg:86%; --cl-bd:38%; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A1D; --surface:#102529; --surface2:#17343A; --line:#26494F;
  --fg:#E4F1F0; --muted:#8FB0B3; --accent:#4FC3CC; --accent-fg:#062226; --warm:#FF8A5C;
  --cl-bg:22%; --cl-fg:86%; --cl-bd:38%; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted)}
.sync.bad{color:var(--warm)}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datenav .dl{font-family:var(--f-display);font-weight:500;font-size:16px;min-width:0;padding:0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-height:38px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warm{border-color:var(--warm);color:var(--warm)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.datenav input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:38px;width:150px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.app{padding-top:16px;display:grid;gap:16px}
.app[aria-busy=true]{pointer-events:none;opacity:.6}
.note{background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.muted{color:var(--muted)}

/* summary */
.sum{display:grid;gap:12px;grid-template-columns:minmax(220px,1.1fr) 3fr}
.occ{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.occ .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em}
.occ small{opacity:.85;font-size:13px}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden}
:root[data-theme="dark"] .meter{background:rgba(6,34,38,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .meter{background:rgba(6,34,38,.25)}}
.meter i{display:block;height:100%;background:currentColor;border-radius:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile.tap{text-align:left;cursor:pointer}
.tile.tap:hover{border-color:var(--accent)}
.tl{display:grid;gap:6px}
.tli{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;text-align:left}
.tli:hover{border-color:var(--accent)}
.tli .no{font-weight:700;font-variant-numeric:tabular-nums}
.tli .chip{min-width:0;padding:1px 6px;font-size:11px}
.tli .d{font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 65% 48%);flex:none}
.dot.outline{background:transparent;border:2px solid hsl(var(--h) 65% 48%)}
.tile input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-display);font-weight:700;font-size:26px;padding:0;font-variant-numeric:tabular-nums;min-height:30px}

/* info panels */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.panel input[type=text],.panel select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-height:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.pill button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;line-height:1;color:var(--muted)}

/* sections */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 6px}
.sec-h h3{font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.assign{background:var(--surface2);padding:8px 12px 10px;display:grid;gap:6px}
.assign select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;min-height:38px;font-weight:600}
.contact{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;font-size:13px}
.ph{font-family:var(--f-mono);font-weight:500;font-size:14px;user-select:all}
a.ph{color:var(--fg);user-select:auto}
.vl{list-style:none;margin:0;padding:4px 0}
.vl li{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;gap:8px}
.vl li+li{border-top:1px dashed var(--line)}
.vl li{flex-wrap:wrap}
.mvline{width:100%;display:flex;flex-direction:column;gap:3px;padding:2px 0 6px}
.mv{font-size:12px;line-height:1.35;border-radius:6px;padding:3px 8px;font-family:var(--f-mono);background:hsl(var(--h) 70% var(--cl-bg));color:hsl(var(--h) 55% var(--cl-fg));border:1px solid hsl(var(--h) 60% var(--cl-bd))}
.mv b{font-family:var(--f-body);font-weight:600}
.mvcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.mvcol{display:grid;gap:10px;min-width:0}
.mvcol h3{font-size:16px}
.mvcol select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:40px;width:100%}
.mvrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.mvh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mvh b{font-family:var(--f-mono);font-size:17px}
.mvh .mini{margin-left:auto}
.mvt{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mvt label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.mvrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-height:40px;width:100%;min-width:0}
.vno{font-family:var(--f-mono);font-weight:600;font-size:15px}
.chipbtn{border:0;background:transparent;padding:2px;border-radius:8px;min-width:86px;display:flex;justify-content:flex-end}
.chip{display:inline-flex;justify-content:center;align-items:center;white-space:nowrap;min-width:64px;padding:5px 10px;border-radius:7px;font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.02em;
  background:hsl(var(--h) var(--s) var(--cl-bg));color:hsl(var(--h) 55% var(--cl-fg));border:1px solid hsl(var(--h) var(--s) var(--cl-bd))}
.chip.outline{background:transparent;border:2px solid hsl(var(--h) 65% 50%);color:hsl(var(--h) 60% var(--cl-fg))}
.chip.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);--h:200;font-weight:500}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px}

.legend{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.legend summary{cursor:pointer;font-weight:600}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding-top:12px}
.lg h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.lg div div{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.lg .chip{min-width:56px;padding:2px 8px;font-size:12px}

/* leave planner */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.lv{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.lv th,.lv td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:38px;height:40px}
.lv th{background:var(--surface2);font-weight:600;line-height:1.1;position:sticky;top:0}
.lv th small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.lvh{display:block;width:100%;height:100%;min-height:40px;border:0;background:none;padding:0;font-weight:inherit;line-height:inherit}
.lvh:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lvk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.lvk:hover{border-color:var(--accent)}
.tli.st:hover{border-color:var(--line)}
.lvg{margin:14px 0 6px;font-size:14px}
.lvg:first-of-type{margin-top:0}
.lv th.today{background:var(--warm);color:#fff}
.lv th.today small{color:#fff}
.lv .stick{position:sticky;left:0;z-index:2;text-align:left;min-width:128px;max-width:160px;padding:0 10px;background:var(--surface);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv th.stick{background:var(--surface2)}
.lv td.today{background:color-mix(in srgb,var(--warm) 10%,var(--surface))}
.lc{width:100%;height:100%;border:0;background:transparent;padding:2px}
.lc .chip{min-width:0;width:100%;padding:3px 0;font-size:11px;border-radius:5px}
.lc.e:hover{background:var(--surface2)}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnav h2{font-size:20px;min-width:150px}

/* staff */
.stf{display:grid;gap:8px;max-width:720px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.srow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.srow input.ph{font-family:var(--f-mono)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.head h2{font-size:20px}

/* picker */
.sheet{position:fixed;inset:0;background:rgba(5,20,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.sheet-card{background:var(--surface);width:min(560px,100%);max-height:86%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:16px;max-height:80%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.sheet-head h2{font-size:18px}
.pg h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;text-align:left;min-height:44px}
.opt[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .chip{min-width:52px;padding:3px 6px;font-size:12px}
.opt span.l{font-size:12px;line-height:1.2;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}

@media(max-width:720px){
  .sum{grid-template-columns:1fr}
  .occ .big{font-size:44px}
  .brand h1{font-size:18px}
  .secs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
.barbtns{display:flex;gap:8px}
.btn.icon{padding:0;width:38px;display:inline-grid;place-items:center}
.btn.icon svg{width:20px;height:20px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.vl li .vbtn{order:1}.vl li .gbox{order:2}.vl li .mvbtn{order:3;margin-left:auto}.vl li .chipbtn{order:4}.vl li .vmeta{order:5}.vl li .mvline{order:6}
.gbox{display:grid;grid-template-columns:auto 52px;gap:3px 6px;align-items:center;font-size:12px;color:var(--muted)}
.gbox input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 4px;min-height:28px;width:100%;text-align:center;font-family:var(--f-mono);font-size:13px}
.mvbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:38px}
.mvbtn:hover{border-color:var(--accent)}
.vbtn{border:0;background:transparent;padding:4px 6px;border-radius:6px;text-align:left;min-height:34px}
.vbtn:hover{background:var(--surface2)}
.vmeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;width:100%;padding-bottom:3px}
.gst{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag{border:1px solid hsl(var(--h) 60% var(--cl-bd));background:hsl(var(--h) 70% var(--cl-bg));color:hsl(var(--h) 55% var(--cl-fg));border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600}
.secsum{padding:0 12px 6px;font-size:12px;color:var(--muted)}
.duadd{padding:8px 12px 12px}
.mv i{opacity:.75}
.fc{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
.fc th,.fc td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
.fc th:first-child,.fc td:first-child{text-align:left}
.fc th{color:var(--muted);font-weight:500;font-size:12px}
.chk{font-size:13px;padding:2px 0}
.chk.warn{color:var(--warm)}
.imp h4,.vpop h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.imp p{margin:0 0 6px}
.vrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vpop textarea,.vpop select,.vpop input,.lvform select,.lvform input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.vpop .vrow select{width:auto;flex:1}
.vpop textarea{resize:vertical;line-height:1.4}
.lvform{display:grid;gap:10px}
.lvform textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0;resize:vertical;line-height:1.4}
.pr{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lvform .pr select{width:auto;flex:1;max-width:240px;color:var(--fg);font-weight:600}
.lvform h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
/* tabs scroll sideways on narrow phones instead of squeezing */
.tabs{overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap}
/* staff ranks */
.rank{display:grid;gap:8px}
.rank+.rank{margin-top:10px}
.rank-h{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.rank-h h3{font-size:16px}
.rank-h .hbtns{justify-content:flex-end}
.rolef{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rank-h h3 span{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.srow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto}
.srow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 6px;min-height:40px;width:100%;min-width:0}
@media(max-width:560px){.srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;padding-bottom:10px;border-bottom:1px dashed var(--line)}.srow [data-f=sname]{grid-column:1/-1;font-weight:600}}
/* supervisor allocation */
.sups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.supc{background:var(--surface);border:1px solid var(--line);border-left:6px solid hsl(var(--h) 62% 46%);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start;min-width:0}
.supc.un{border-left:6px dashed var(--line)}
.supc .nm{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.supc .nm b{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.supc .ln{font-size:13px;color:var(--muted)}
.supc .off{font-size:12px;font-weight:600;color:var(--warm)}

<script>
/* KVM Flow report reader. Reads the daily front-office PDF with pdf.js and returns structured data. */
(function(g){
"use strict";
var MON={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
var MON3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var P2=function(n){return (n<10?'0':'')+n};
var DATE_LONG=/^\w+day (\d{1,2}) (\w+) (\d{4})$/;
function isoLong(s){var m=DATE_LONG.exec(s);if(!m)return null;var mo=MON[m[2].toLowerCase()];return mo?m[3]+'-'+P2(mo)+'-'+P2(+m[1]):null}
var HEAD={'Villa':'villa','Adult':'ad','Child':'ch','NAT.':'nat','VIP':'vip','Nights':'nights','Butler':'butler','C/O':'co','Dep. FLT':'flt','Arr. FLT':'flt','FLT. Time':'fltTime','Dep.Time':'out','ETA to KVM':'eta','Villa Status':'ready','MP':'mp','Boat':'boat','Arr. Date':'arrDate','Dep. Date':'depDate','Guest Name':'name','Remarks':'remarks','From':'from','To':'to','C/I':'ci'};

async function loadPages(lib,buf,scale){
  var doc=await lib.getDocument({data:new Uint8Array(buf)}).promise,out=[];
  for(var n=1;n<=doc.numPages;n++){
    var page=await doc.getPage(n),vp=page.getViewport({scale:1}),vs=page.getViewport({scale:scale});
    var tc=await page.getTextContent(),items=[];
    tc.items.forEach(function(it){var s=(it.str||'').trim();if(s)items.push({x:it.transform[4],y:vp.height-it.transform[5],s:s})});
    var cv=document.createElement('canvas');cv.width=Math.ceil(vs.width);cv.height=Math.ceil(vs.height);
    var ctx=cv.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,canvas:cv,viewport:vs}).promise;
    out.push({n:n,w:vp.width,h:vp.height,items:items,img:ctx.getImageData(0,0,cv.width,cv.height),scale:scale});
  }
  return out;
}
/* y positions (points from top) of long horizontal lines across the x range */
function hBorders(pg,x0,x1,y0,y1){
  var s=pg.scale,d=pg.img.data,W=pg.img.width,H=pg.img.height,a=Math.max(0,Math.floor(x0*s)),b=Math.min(W,Math.ceil(x1*s)),need=0.9*(b-a),ys=[];
  for(var y=Math.max(0,Math.floor(y0*s));y<Math.min(H,Math.ceil(y1*s));y++){
    var c=0;for(var x=a;x<b;x++){var i=(y*W+x)*4;if(d[i]<215&&d[i+1]<215&&d[i+2]<215)c++}
    if(c>=need)ys.push(y);
  }
  var out=[],st=null,pv=null;
  ys.forEach(function(y){if(st===null){st=y;pv=y}else if(y-pv<=2){pv=y}else{out.push((st+pv)/2/s);st=y;pv=y}});
  if(st!==null)out.push((st+pv)/2/s);
  return out;
}
function findTitles(pg){
  var out=[];
  pg.items.forEach(function(it){
    var m=/^(Draft )?(Room Move|Arrival|Departure)$/.exec(it.s);
    if(m){
      var d=pg.items.find(function(o){return Math.abs(o.y-it.y)<1.5&&o.x>it.x&&o.x-it.x<60&&DATE_LONG.test(o.s)});
      if(d)out.push({kind:m[2]==='Room Move'?'move':m[2]==='Arrival'?'arr':'dep',draft:!!m[1],date:isoLong(d.s),y:it.y,x:it.x});
    }else if(/^GUESTS IN-HOUSE/i.test(it.s))out.push({kind:'inh',draft:false,date:null,y:it.y,x:it.x});
  });
  return out.sort(function(a,b){return a.y-b.y});
}
function buildCols(pg,y0,y1){
  var h=pg.items.filter(function(it){return it.y>=y0&&it.y<y1&&HEAD[it.s]&&it.s!=='Remarks'&&it.s!=='Guest Name'});
  var st=pg.items.filter(function(it){return it.s==='Status'&&it.y>=y0&&it.y<y1});
  var cols=[];
  h.forEach(function(t){cols.push({key:HEAD[t.s],x:t.x,label:t.s})});
  st.forEach(function(s){var c=cols.find(function(c){return c.label==='Villa'&&Math.abs(c.x-s.x)<4&&c.x>200});if(c){c.key='ready';c.label='Villa Status'}});
  cols.sort(function(a,b){return a.x-b.x});
  return cols;
}
function colAt(cols,x){var f=null;for(var i=0;i<cols.length;i++){if(x>=cols[i].x-6)f=i}return f}

function cellOf(b,yc){var top=-1e9,bot=1e9;b.forEach(function(v){if(v<=yc&&v>top)top=v;if(v>yc&&v<bot)bot=v});return [top,bot]}
function parseTable(pg,seg,state,res){
  var cols=buildCols(pg,seg.y0,seg.y0+36);
  if(cols.length>=6)state.cols=cols;else cols=state.cols;
  if(!cols||!cols.length)return;
  var vi=cols.findIndex(function(c){return c.key==='villa'});if(vi<0)return;
  var vx=cols[vi].x,last=cols[cols.length-1];
  var anchors=pg.items.filter(function(t){return t.y>seg.y0+10&&t.y<seg.y1&&/^\d{4}$/.test(t.s)&&Math.abs(t.x-vx)<6})
    .map(function(t){return {villa:t.s,yc:t.y-2.5,f:{}}}).sort(function(a,b){return a.yc-b.yc});
  if(!anchors.length)return;
  var cache={};
  function bord(i){
    if(cache[i])return cache[i];
    var x0=cols[i].x-3,x1=(i+1<cols.length?cols[i+1].x-3:cols[i].x+14);
    return cache[i]=hBorders(pg,x0+2,Math.min(x1-2,x0+16),seg.y0,seg.y1+4);
  }
  /* pass 1: each value goes to the villa row (band between the villa column lines) it sits in */
  var vb=bord(vi);
  anchors.forEach(function(a){var c=cellOf(vb,a.yc);a.top=c[0];a.bot=c[1]});
  pg.items.forEach(function(t){
    if(t.y<=seg.y0+10||t.y>=seg.y1)return;
    var i=colAt(cols,t.x);if(i===null)return;
    var key=cols[i].key;if(key==='villa'||key==='name'||key==='remarks')return;
    if(i===cols.length-1&&t.x>=last.x+10.5)key='rem';
    var yc=t.y-2.5,row=anchors.find(function(a){return yc>=a.top-0.5&&yc<a.bot+0.5});
    if(!row)row=anchors.reduce(function(p,a){return Math.abs(a.yc-yc)<Math.abs(p.yc-yc)?a:p});
    if(Math.abs(row.yc-yc)>60)return;
    (row.f[key]=row.f[key]||[]).push(t);
  });
  /* pass 2: a value in a merged cell (a party sharing a flight or boat) also belongs to the other villas in that cell */
  var MERGE={flt:1,fltTime:1,boat:1,eta:1,out:1,co:1,ready:1,butler:1};
  cols.forEach(function(c,i){
    if(!MERGE[c.key])return;
    var b=bord(i);
    anchors.forEach(function(a){
      if(a.f[c.key])return;
      var cell=cellOf(b,a.yc);
      if(cell[1]-cell[0]>140)return;
      var other=anchors.find(function(o){return o!==a&&o.f[c.key]&&o.yc>=cell[0]-0.5&&o.yc<=cell[1]+0.5});
      if(other)a.f[c.key]=other.f[c.key];
    });
  });
  anchors.forEach(function(a){
    var o={};Object.keys(a.f).forEach(function(k){o[k]=a.f[k].slice().sort(function(p,q){return p.y-q.y||p.x-q.x}).map(function(t){return t.s}).join(' ')});
    var num=function(x){var n=parseInt(String(x).split(' ')[0],10);return isNaN(n)?0:n};o.ad=num(o.ad);o.ch=num(o.ch);
    var kind=seg.t.kind;
    if(kind==='inh'){res.inh[a.villa]=o;return}
    var d=seg.t.date,bucket=res[kind][d]=res[kind][d]||{};
    o.draft=!!seg.t.draft;bucket[a.villa]=o;
  });
}
function parseMoves(pg,seg,res){
  var hdr=pg.items.filter(function(t){return t.y>seg.y0&&t.y<seg.y0+14&&t.x<256&&HEAD[t.s]});
  var cols=hdr.map(function(t){return {key:HEAD[t.s],x:t.x}}).sort(function(a,b){return a.x-b.x});
  if(!cols.length)return;
  var rows=[];
  pg.items.filter(function(t){return t.y>seg.y0+8&&t.y<seg.y1&&t.x<256}).sort(function(a,b){return a.y-b.y}).forEach(function(t){
    var r=rows.find(function(r){return Math.abs(r.y-t.y)<2.5});if(!r){r={y:t.y,t:[]};rows.push(r)}r.t.push(t)});
  var d=seg.t.date,list=res.mv[d]=res.mv[d]||[];
  rows.forEach(function(r){
    var f={};r.t.forEach(function(t){var i=colAt(cols,t.x);var k=i===null?'name':cols[i].key;(f[k]=f[k]||[]).push(t)});
    var j=function(k){return f[k]?f[k].sort(function(a,b){return a.x-b.x}).map(function(t){return t.s}).join(' '):''};
    var from=j('from'),to=j('to');
    if(/^\d{4}$/.test(from)&&/^\d{4}$/.test(to)){
      var nm=r.t.filter(function(t){return t.x<cols[0].x-4}).map(function(t){return t.s}).join(' ');
      var px=/\((\d+)(?:\s*\+\s*(\d+))?\s*pax\)/i.exec(nm);
      list.push({from:from,to:to,co:j('co'),ci:j('ci'),butler:j('butler'),pax:px?px[0].replace(/[()]/g,''):'',draft:!!seg.t.draft});
    }
  });
}
function parseForecast(pg,res){
  /* found by its labels, not fixed positions, so a report that sits a little higher or lower still reads */
  var title=pg.items.find(function(t){return /^Occupancy Forecast$/i.test(t.s)});
  var dayRow=pg.items.find(function(t){return t.s==='Day'&&t.x<100}),dateRow=pg.items.find(function(t){return t.s==='Date'&&t.x<100});
  var rd=(title&&pg.items.find(function(t){return Math.abs(t.y-title.y)<3&&t.x>title.x&&DATE_LONG.test(t.s)}))||
    pg.items.find(function(t){return t.x>300&&t.y<(dayRow?dayRow.y:pg.h/3)&&DATE_LONG.test(t.s)});
  if(rd)res.date=isoLong(rd.s);
  if(!dayRow||!dateRow||!res.date)return;
  var top=pg.items.filter(function(t){return t.y>dayRow.y-6&&t.y<dayRow.y+60});
  var dts=top.filter(function(t){return Math.abs(t.y-dateRow.y)<1.5&&/^\d{1,2}-\w{3}$/.test(t.s)}).sort(function(a,b){return a.x-b.x});
  var y0=+res.date.slice(0,4),m0=+res.date.slice(5,7);
  var cols=dts.map(function(t){var m=/^(\d{1,2})-(\w{3})$/.exec(t.s),mo=MON3[m[2].toLowerCase()],yy=y0;if(mo<m0-6)yy++;return {x:t.x,date:yy+'-'+P2(mo)+'-'+P2(+m[1])}});
  var LAB=[[/^Daily Occupancy/i,'pct'],[/^Guest in house/i,'adult'],[/^Children in house/i,'child'],[/^Total Guest/i,'total'],[/^No of Villa Arr/i,'arr'],[/^No of Villa Dep/i,'dep'],[/^Villa Moves/i,'vm'],[/^No of Villa Occupied/i,'occupied']];
  top.filter(function(t){return t.x<100}).forEach(function(l){
    var lab=LAB.find(function(p){return p[0].test(l.s)});if(!lab)return;
    top.filter(function(t){return Math.abs(t.y-l.y)<1.5&&t.x>100&&t.x<240}).forEach(function(v){
      var c=cols.reduce(function(p,c){return Math.abs(c.x-v.x)<Math.abs(p.x-v.x)?c:p});
      if(Math.abs(c.x-v.x)>9)return;
      var o=res.forecast[c.date]=res.forecast[c.date]||{};o[lab[1]]=parseFloat(v.s.replace('%',''));
    });
  });
}
async function parseReport(lib,buf){
  var pages=await loadPages(lib,buf,3);
  var res={date:null,forecast:{},arr:{},dep:{},mv:{},inh:{},pages:pages.length};
  parseForecast(pages[0],res);
  var cur=null,state={cols:null};
  pages.forEach(function(pg){
    var titles=findTitles(pg),segs=[];
    if(!titles.length){if(cur)segs.push({t:cur,y0:0,y1:pg.h})}
    else{
      if(cur&&titles[0].y>40)segs.push({t:cur,y0:0,y1:titles[0].y-1});
      titles.forEach(function(t,i){segs.push({t:t,y0:t.y,y1:i+1<titles.length?titles[i+1].y-1:pg.h})});
      cur=titles[titles.length-1];
    }
    segs.forEach(function(s){
      if(s.t.kind==='inh'&&!s.t.date)s.t.date=res.date;
      if(s.t.kind==='move')parseMoves(pg,s,res);else parseTable(pg,s,state,res);
    });
  });
  /* no forecast table found: use the first day of the arrival and departure lists */
  if(!res.date){var ds=Object.keys(res.arr).concat(Object.keys(res.dep)).sort();if(ds.length)res.date=ds[0]}
  return res;
}
g.KVM={parseReport:parseReport};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const GROUPS=[
 {name:'Occupancy',codes:[['OCC','Occupied',205,70],['VAC','Vacant',215,14],['B2B ARR','Back to back arrival',330,65],['B2B MV','Back to back villa move',280,55],['VC','Cleaned',150,60],['ARR','Arrival',318,60],['VMI','Villa move in',268,60],['VMO','Villa move out',245,45],['DEP','Departure',340,65],['OOO','Out of order',0,72]]},
 {name:'Maintenance',codes:[['OOS','Out of service',0,72,1]]}
];
const LEAVE=[['OFF','Day off',200,60],['AL','Annual leave',150,60],['PH','Public holiday',36,85],['SL','Sick leave',0,70],['SP','Special leave',280,50]];
const MAP={};GROUPS.forEach(g=>g.codes.forEach(c=>MAP[c[0]]={code:c[0],label:c[1],h:c[2],s:c[3],o:c[4]}));
const LMAP={};LEAVE.forEach(c=>LMAP[c[0]]={code:c[0],label:c[1],h:c[2],s:c[3]});
const OCCUPIED=['OCC','ARR','B2B ARR','VMI','B2B MV'], DEPARTING=['DEP','B2B ARR'], ARRIVING=['ARR','B2B ARR'];
const LEGACY={VD:'VAC','I-RS':'VC',OD:'OCC',OC:'OCC',DND:'OCC',LO:'OCC',SO:'OCC',DO:'DEP',CO:'VAC',VM:'VMO'};
const migSt=st=>{const o={};Object.keys(st||{}).forEach(k=>{o[k]=LEGACY[st[k]]||st[k]});return o};

const SECDEF=[
 [1,[1004,1005,1011,1012,1026,1036]],[2,[1009,1014,1023,1024,1029,1030]],[3,[1007,1008,1017,1020,1027,1032]],
 [4,[1003,1006,1018,1019,1025,1031]],[5,[1001,1013,1016,1028,1034,1033]],[6,[1002,1010,1015,1021,1022,1035]],
 [7,[2010,2011,2012,2013,2014]],[8,[2001,2002,2003,3001]],[9,[2004,2005,2006,3002]],[10,[2007,2008,2009,3003]],
 [11,[2015,2016,'MADAM']],[12,[2017,2018,2019,3004]],[13,[2020,2021,2022,3005]],[14,[2023,2024,2025,5000]],
 [15,[2026,2027,2028,3006]],[16,[2029,2030,2031,5001]],[17,[]]
];
const NONSELL=['MADAM','DAY'];
const LABEL={MADAM:'MADAM ROOM',DAY:'DAY USE'};
const SELLABLE=[];SECDEF.forEach(([n,v])=>v.forEach(x=>{const id=String(x);if(!NONSELL.includes(id))SELLABLE.push(id)}));
/* day use (Section 17): its rows are added and removed on the Board and saved with the layout.
   DAY is the original single row, so statuses saved on it still show */
const DU_SEC=17,isDU=id=>id==='DAY'||/^du-/.test(id);
let DUROWS=[{id:'DAY',label:'DAY USE'}];
const setDuRows=l=>{DUROWS=l;l.forEach(r=>{LABEL[r.id]=r.label})};
const secIds=([n,v])=>n===DU_SEC?v.concat(DUROWS.map(r=>r.id)):v;
let LAYOUT={},SECTIONS=[];
const origSec=id=>{let r=0;SECDEF.forEach(e=>{if(secIds(e).map(String).includes(id))r=e[0]});return r};
function buildSections(){
  const m={};SECDEF.forEach(([n])=>{m[n]=[]});
  SECDEF.forEach(e=>secIds(e).forEach(x=>{const id=String(x),t=(LAYOUT[id]&&m[LAYOUT[id]])?LAYOUT[id]:e[0];m[t].push(id)}));
  SECTIONS=SECDEF.map(([n])=>({n,title:'Section '+String(n).padStart(2,'0'),villas:m[n].map(id=>({id,label:LABEL[id]||id}))}));
}
buildSections();

/* starting point taken from the 1 Oct 2026 board in March_2026.xlsx, old codes mapped to the new list */
const BASE_ST=('1004:VM,1005:DEP,1011:OCC,1012:OCC,1026:OCC,1036:OCC,1009:OCC,1014:OCC,1023:ARR,1024:OCC,1029:OCC,1030:ARR,'+

function localStore(){
  return {get:async k=>{try{const v=localStorage.getItem('vsb:'+k);return v?JSON.parse(v):null}catch(e){return null}},
          set:async(k,o)=>{try{localStorage.setItem('vsb:'+k,JSON.stringify(o))}catch(e){throw e}}};

async function initStore(){
  let db=null,user=null,id=null;
  try{ if(window.claude&&window.claude.use){db=await window.claude.use('db');user=await window.claude.use('user');} }catch(e){}
  try{ if(user&&user.id)id=await user.id(); }catch(e){}
  if(db&&id){
    const col=db.collection('data/users/'+id);
    S.mode='cloud';
    return {get:async k=>{const s=await col.doc(k).get();return s.exists?clone(s.data()):null},set:async(k,o)=>{await col.doc(k).set(o)}};
  }

  return localStore();
}
const timers={},chains={},pend={};
function setSync(t,bad){const e=$('#sync');e.textContent=t;e.classList.toggle('bad',!!bad)}
function touch(key){
  if(key.startsWith('d-'))S.note='';
  pend[key]=1;setSync('Saving…');clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key),500);
}
function snap(key){
  if(key==='staff')return {list:S.staff,roles:ROLES};
  if(key==='index')return {days:S.index};
  if(key==='layout')return {map:LAYOUT,du:DUROWS};
  if(key.startsWith('fc-'))return S.fcs[key.slice(3)]||{};
  if(key.startsWith('d-'))return S.day;
  if(key.startsWith('m-'))return {cells:S.months[key.slice(2)]||{}};
  if(key.startsWith('p-'))return S.plans[key.slice(2)]||emptyPlan();
  return {};
}
function flush(key){
  delete pend[key];clearTimeout(timers[key]);
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    try{
      if(key.startsWith('d-')){const d=key.slice(2);if(!S.index.includes(d)){S.index.push(d);S.index.sort();if(S.index.length>500)S.index=S.index.slice(-500);touch('index')}}
      await store.set(key,snap(key));
      setSync(S.mode==='cloud'?'Saved':'Saved on this device only');
    }catch(e){setSync('Could not save. Check your connection.',true)}
  });
}

async function saveAll(){
  if(!S.day){return}
  const keys=new Set(Object.keys(pend).concat(['staff','layout','d-'+S.date]));
  keys.forEach(k=>flush(k));
  setSync('Saving…');
  await Promise.all(Object.keys(chains).map(k=>chains[k]));
  toast(S.mode==='cloud'?'All changes saved':'Saved on this device');
}

/* ---------- loading ---------- */
function newDay(){return {sec:{},sup:{},st:{},adult:'',child:'',infant:'',show:'',project:'',duty:[],g:{},fc:null,chk:{}}}
function normDay(d){const n=newDay();return Object.assign(n,d||{},{sec:(d&&d.sec)||{},sup:(d&&d.sup)||{},st:migSt(d&&d.st),duty:(d&&d.duty)||[],g:(d&&d.g)||{},fc:(d&&d.fc)||null,chk:(d&&d.chk)||{}})}
async function loadMonth(ym){
  if(S.months[ym])return;
  try{const m=await store.get('m-'+ym);S.months[ym]=(m&&m.cells)||{}}catch(e){S.months[ym]={}}
}
async function loadPlan(d){
  if(S.plans[d])return;
  try{const p=await store.get('p-'+d);S.plans[d]=normPlan(p)}catch(e){S.plans[d]=emptyPlan()}
}
/* a villa that empties (departure or move out) and fills again the same day is a back to back turnover */
function dayCode(arr,dep,out,inn){
  const empties=dep||out;
  if(arr)return empties?'B2B ARR':'ARR';
  if(inn)return empties?'B2B MV':'VMI';
  if(dep)return 'DEP';
  if(out)return 'VMO';
  return null;
}
const ROLL={ARR:'OCC','B2B ARR':'OCC',VMI:'OCC','B2B MV':'OCC',DEP:'VAC',VMO:'VAC'};
function rollDay(d){
  Object.keys(d.st).forEach(k=>{if(ROLL[d.st[k]])d.st[k]=ROLL[d.st[k]]});
  const g={};Object.keys(d.g).forEach(k=>{if(d.st[k]==='OCC')g[k]=d.g[k]});
  d.g=g;d.adult='';d.child='';d.infant='';d.fc=null;d.fcAuto=false;d.chk={};
  return d;
}
function planStatus(d,date){
  const p=planOf(date),from={},to={};let n=0;
  p.mv.forEach(m=>{if(m.from)from[m.from]=1;if(m.to)to[m.to]=1});
  SELLABLE.forEach(id=>{
    const cur=d.st[id];if(cur==='OOO'||cur==='OOS')return;
    let c=null;
    c=dayCode(p.arr[id],p.dep[id],from[id],to[id]);
    if(c){d.st[id]=c;n++}
  });
  return n;
}
async function loadDay(){
  const my=++tok;S.ready=false;render();
  const date=S.date;let d=null,note='';
  try{d=await store.get('d-'+date)}catch(e){d=null}
  if(my!==tok)return;
  if(d){d=normDay(d)}
  else{
    const prev=S.index.filter(x=>x<date).pop();
    let t=null;
    if(prev){try{t=await store.get('d-'+prev)}catch(e){}}
    if(my!==tok)return;
    await Promise.all([loadPlan(date),loadPlan(addDays(date,1))]);
    if(my!==tok)return;
    if(t){d=rollDay(normDay(clone(t)));note='Started from '+fmtShort(prev)+': arrivals and moves in are now OCC, departures and moves out are now VAC'}
    else{d=newDay();d.st=migSt(BASE_ST);d.sec={};note='Started from the 1 Oct board in your March_2026 sheet'}
    const n=planStatus(d,date);
    note+=(n?', and '+n+(n===1?' villa was':' villas were')+' set from the arrivals and departures planned for this day':'')+'. Change any status and it saves to this day.';
  }
  await loadMonth(date.slice(0,7));
  await Promise.all([loadPlan(date),loadPlan(addDays(date,1))]);
  if(my!==tok)return;
  let fd=S.fcs[date];
  if(fd===undefined){try{fd=await store.get('fc-'+date)}catch(e){fd=null}S.fcs[date]=fd}
  if(my!==tok)return;
  if(fd&&(!d.fc||d.fcAuto)){
    d.fc={pct:fd.pct,occupied:fd.occupied,arr:fd.arr,dep:fd.dep,vm:fd.vm,ooo:fd.ooo,oos:fd.oos};d.fcAuto=true;
    if(fd.adult!=null)d.adult=fd.adult;if(fd.child!=null)d.child=fd.child;if(fd.infant!=null)d.infant=fd.infant;
    if(!note)note='Occupancy forecast filled from the latest report you imported.';
  }
  S.day=d;S.note=note;S.ready=true;render();
}
async function boot(){
  store=await initStore();
  try{
    const st=await store.get('staff');
    if(st&&st.list){S.staff=st.list;S.staffSaved=true}else{S.staff=clone(BASE_STAFF)}
    /* staff lists saved before roles could be edited have no roles field and keep the default Other role */
    if(st&&Array.isArray(st.roles))setRoles(st.roles.filter(r=>Array.isArray(r)&&r[0]&&r[1]&&!FIXED_RANKS.some(f=>f[0]===r[0])).map(r=>[String(r[0]),String(r[1]),String(r[2]||r[1])]));
    const ix=await store.get('index');S.index=(ix&&ix.days)||[];
    const lo=await store.get('layout');LAYOUT=(lo&&lo.map)||{};
    if(lo&&Array.isArray(lo.du))setDuRows(lo.du.filter(r=>r&&isDU(r.id)).map(r=>({id:String(r.id),label:String(r.label||'DAY USE')})));
    buildSections();
  }catch(e){S.staff=clone(BASE_STAFF)}
  setSync(S.mode==='cloud'?'Saved':'Saved on this device only');
  await loadDay();
}

     :'<p class="muted" style="margin:0">No rooms have this status.</p>');

function stats(){
  const st=S.day.st;let occ=0,arr=0,dep=0,vm=0,ooo=0,oos=0,vac=0;
  SELLABLE.forEach(v=>{const c=st[v];if(!c)return;
    if(TLIST.vac.c.includes(c))vac++;if(OCCUPIED.includes(c))occ++;if(ARRIVING.includes(c))arr++;if(DEPARTING.includes(c))dep++;if(c==='VMI'||c==='B2B MV')vm++;if(c==='OOO')ooo++;if(c==='OOS')oos++});
  const m=S.months[S.date.slice(0,7)]||{},day=+S.date.slice(8);let off=0,lv=0;
  S.staff.forEach(p=>{const c=(m[p.id]||{})[day];if(c==='OFF')off++;else if(c)lv++});
  const total=SELLABLE.length,fc=S.day.fc||{},pk=(a,b)=>(b!=null&&b!=='')?b:a;
  occ=pk(occ,fc.occupied);arr=pk(arr,fc.arr);dep=pk(dep,fc.dep);vm=pk(vm,fc.vm);ooo=pk(ooo,fc.ooo);oos=pk(oos,fc.oos);
  const pct=fc.pct!=null?fc.pct:Math.round(occ/total*100);
  return {occ,arr,dep,vm,ooo,oos,vac,total,pct,fromReport:!!S.day.fc,off,lv,duty:Math.max(0,S.staff.length-off-lv)};
}

  [[S.date,'today'],[addDays(S.date,1),'tomorrow']].forEach(function(x){

const mins=t=>{const m=/^(\d{1,2}):?(\d{2})$/.exec(String(t||'').trim());return m?+m[1]*60+ +m[2]:null};

function nextArrival(ids){

    touch('m-'+ym);d=addDays(d,1);n++;
  }
  S.month=f.slice(0,7);await loadMonth(S.month);
  toast((clear?'Cleared ':'Planned ')+n+(n===1?' day':' days'));render();
}
function render(){
  headHTML();
  const app=$('#app');
  app.setAttribute('aria-busy',String(!S.ready));
  if(!S.day){app.innerHTML='<div class="note">Loading your board…</div>';return}
  app.innerHTML=S.tab==='board'?boardHTML():S.tab==='move'?moveHTML():S.tab==='sup'?supHTML():S.tab==='but'?butlerHTML():S.tab==='leave'?leaveHTML():staffHTML();
}

/* ---------- picker + toast ---------- */
let pickCb=null,lastFocus=null;
function openPicker(title,groups,current,cb){
  lastFocus=document.activeElement;pickCb=cb;
  $('#pk-title').textContent=title;
  $('#pk-body').innerHTML=groups.map(g=>'<div class="pg">'+(g.name?'<h4>'+g.name+'</h4>':'')+'<div class="opts">'+g.items.map(c=>
    '<button class="opt" data-act="pk-pick" data-code="'+c.code+'" aria-pressed="'+(c.code===current)+'">'+chip(c.code,g.map)+'<span class="l">'+esc(c.label)+'</span></button>').join('')+'</div></div>').join('')+
    '<div class="pg"><div class="opts"><button class="opt" data-act="pk-pick" data-code="" aria-pressed="'+(!current)+'"><span class="chip empty">—</span><span class="l">Clear</span></button></div></div>';
  $('#picker').hidden=false;$('#pk-close').focus();
}
function closePicker(){$('#picker').hidden=true;pickCb=null;if(S.dirty){S.dirty=false;render()}if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},1600)}
function openStatus(v){
  const cur=S.day.st[v];
  openPicker('Status for '+(LABEL[v]||v),GROUPS.map(g=>({name:g.name,map:MAP,items:g.codes.map(c=>({code:c[0],label:c[1]}))})),cur,code=>{
    if(code)S.day.st[v]=code;else delete S.day.st[v];touch('d-'+S.date);render()});
}
function copyText(t){
  const fb=()=>{try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copied')}catch(e){toast('Select the number to copy')}};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),fb)}catch(e){fb()}
}

/* ---------- events ---------- */
function setDate(d){S.date=d;S.arm=null;loadDay()}
document.addEventListener('click',e=>{
  if(e.target.id==='picker'){closePicker();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='pk-close'){closePicker();return}
  if(a==='theme'){const t=curTheme()==='dark'?'light':'dark';applyTheme(t,true);toast(t==='dark'?'Dark mode':'Light mode');return}
  if(a==='pk-pick'){const cb=pickCb;closePicker();if(cb)cb(b.dataset.code);return}
  if(!S.day&&a!=='tab')return;
  if(a==='tab'){S.tab=b.dataset.t;S.arm=null;if(S.tab==='leave')loadMonth(S.month).then(render);if(S.tab==='move')loadPlan(S.pdate).then(render);render()}
  else if(a==='goto-move'){S.tab='move';S.pdate=addDays(S.date,1);loadPlan(S.pdate).then(render);render()}
  else if(a==='pprev'||a==='pnext'||a==='ptomorrow'){S.pdate=a==='ptomorrow'?addDays(iso(new Date()),1):addDays(S.pdate,a==='pnext'?1:-1);loadPlan(S.pdate).then(render);render()}
  else if(a==='mv-del'){const p=ensurePlan(S.pdate);if(b.dataset.k==='mv')p.mv.splice(+b.dataset.v,1);else delete p[b.dataset.k][b.dataset.v];touch('p-'+S.pdate);render()}
  else if(a==='mv-copy')copyText(mvSummary());
  else if(a==='mv-addmove'){ensurePlan(S.pdate).mv.push({from:'',to:'',co:'',ci:'',butler:'',pax:''});touch('p-'+S.pdate);render()}
  else if(a==='kvm-pick'){const i=$('#kvmfile');if(i)i.click()}
  else if(a==='kvm-apply'){closePicker();if(S.pending){const r=S.pending;S.pending=null;applyReport(r).catch(function(){toast('Could not apply the report.')})}}
  else if(a==='sec-copy')copyText(secBrief(secOfN(b.dataset.sec)));
  else if(a==='prev')setDate(addDays(S.date,-1));
  else if(a==='next')setDate(addDays(S.date,1));
  else if(a==='today')setDate(iso(new Date()));
  else if(a==='dismiss'){S.note='';render()}
  else if(a==='reset'){if(S.arm==='reset'){S.day.st={};S.arm=null;touch('d-'+S.date)}else S.arm='reset';render()}
  else if(a==='copy')copyText(b.dataset.copy);
  else if(a==='status')openStatus(b.dataset.v);
  else if(a==='lv-day'){const d=b.dataset.d;lvLoadNear(S.month).then(()=>openInfo(fmtLong(d),lvDayHTML(d)))}
  else if(a==='lv-code'){const c=b.dataset.c;lvLoadNear(S.month).then(()=>openInfo(LMAP[c].label+', '+new Date(S.month+'-01T00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}),lvCodeHTML(c)))}
  else if(a==='sv-chk'){const c=S.day.chk||(S.day.chk={}),v=b.dataset.v;if(c[v])delete c[v];else c[v]=1;touch('d-'+S.date);render()}
  else if(a==='tlist'&&TLIST[b.dataset.k])openInfo(TLIST[b.dataset.k].t,tileListHTML(b.dataset.k));
  else if(a==='villa'){S.dirty=false;openInfo('Villa '+(LABEL[b.dataset.v]||b.dataset.v),villaHTML(b.dataset.v))}
  else if(a==='vstatus'){const v=b.dataset.v;closePicker();openStatus(v)}
  else if(a==='vmove'){const v=b.dataset.v,cur=SECTIONS.find(x=>x.villas.some(y=>y.id===v));openInfo('Move villa '+(LABEL[v]||v),'<p class="muted" style="margin:0 0 10px">Choose the section for this villa. It stays there every day until you move it again.</p><div class="opts">'+SECTIONS.map(x=>'<button class="opt" data-act="vmove-to" data-v="'+esc(v)+'" data-n="'+x.n+'" aria-pressed="'+(cur&&cur.n===x.n)+'"><span class="l" style="color:var(--fg);font-weight:600">'+x.title+'</span></button>').join('')+'</div>'+(LAYOUT[v]?'<div style="margin-top:12px"><button class="btn sm" data-act="vorig" data-v="'+esc(v)+'">Back to original section</button></div>':''))}
  else if(a==='vmove-to'){const id=b.dataset.v,n=+b.dataset.n;if(n===origSec(id))delete LAYOUT[id];else LAYOUT[id]=n;buildSections();touch('layout');S.dirty=true;closePicker();toast('Moved to Section '+String(n).padStart(2,'0'))}
  else if(a==='du-row'){const id='du-'+uid().slice(1);setDuRows(DUROWS.concat([{id,label:'DAY USE '+(DUROWS.length+1)}]));buildSections();touch('layout');render();openInfo(LABEL[id],villaHTML(id));S.dirty=true}
  else if(a==='du-del'){
    /* tap twice, as with Delete on the staff list */
    if(!b.dataset.armed){b.dataset.armed='1';b.classList.add('warm');b.textContent='Tap again to remove';return}
    const id=b.dataset.v;
    setDuRows(DUROWS.filter(r=>r.id!==id));delete LAYOUT[id];buildSections();touch('layout');
    S.dirty=true;closePicker();
  }
  else if(a==='vorig'){delete LAYOUT[b.dataset.v];buildSections();touch('layout');S.dirty=true;closePicker()}
  else if(a==='save')saveAll();
  else if(a==='lv-apply')applyLeave(false);
  else if(a==='lv-clear')applyLeave(true);
  else if(a==='duty-del'){S.day.duty=S.day.duty.filter(x=>x!==b.dataset.id);touch('d-'+S.date);render()}
  else if(a==='leave'){
    const sid=b.dataset.s,d=+b.dataset.d,p=S.staff.find(x=>x.id===sid),cells=S.months[S.month]||(S.months[S.month]={});
    openPicker(p.name+', '+d+' '+new Date(+S.month.slice(0,4),+S.month.slice(5)-1,1).toLocaleDateString('en-GB',{month:'long'}),
      [{name:'',map:LMAP,items:LEAVE.map(c=>({code:c[0],label:c[1]}))}],(cells[sid]||{})[d],code=>{
        const r=cells[sid]||(cells[sid]={});if(code)r[d]=code;else delete r[d];touch('m-'+S.month);render()});
  }
  else if(a==='mprev'||a==='mnext'||a==='mtoday'){
    const [y,m]=S.month.split('-').map(Number);
    const nd=a==='mtoday'?new Date():new Date(y,m-1+(a==='mnext'?1:-1),1);
    S.month=iso(nd).slice(0,7);loadMonth(S.month).then(render);render();
  }
  else if(a==='sup-villa')supPick(b.dataset.v);
  else if(a==='supv-pick'){const v=b.dataset.v;if(b.dataset.id)S.day.sup[v]=b.dataset.id;else delete S.day.sup[v];touch('d-'+S.date);closePicker();render()}
  else if(a==='sup-copy')copyText(supBrief(b.dataset.id));
  else if(a==='sup-all')copyText(supAll());
  else if(a==='but-copy'){const x=butGroup(b.dataset.k);if(x)copyText(butlerBrief(x))}
  else if(a==='but-add')addButler('');
  else if(a==='but-staff'){const x=butGroup(b.dataset.k);if(x)addButler(x.name)}
  else if(a==='but-villa')butPick(b.dataset.v);
  else if(a==='butv-pick'){const v=b.dataset.v,n=b.dataset.n;closePicker();setButler(v,n)}
  else if(a==='butv-new'){const i=$('#butnew'),n=i?i.value.trim():'',v=b.dataset.v;if(!n){toast('Type the butler\'s name');return}closePicker();setButler(v,n)}
  else if(a==='but-all')copyText(butlerAll());
  else if(a==='sup-even'){if(S.arm==='sup-even'||!Object.keys(S.day.sup).length){const k=shareEven();S.arm=null;touch('d-'+S.date);toast('Shared between '+k+(k===1?' supervisor':' supervisors'))}else S.arm='sup-even';render()}
  else if(a==='sup-clear'){if(S.arm==='sup-clear'){S.day.sup={};S.arm=null;touch('d-'+S.date)}else S.arm='sup-clear';render()}
  else if(a==='staff-paste')pasteStaff();
  else if(a==='bk-down')downloadBackup();
  else if(a==='bk-file'){const i=$('#bkfile');if(i)i.click()}
  else if(a==='staff-add'){const p={id:uid(),name:'',phone:'',role:b.dataset.r||'ra'};S.staff.push(p);S.staffSaved=true;touch('staff');render();const i=$('#sn-'+p.id);if(i)i.focus()}
  else if(a==='role-add')addRole();
  else if(a==='role-del'){const k='role:'+b.dataset.r;if(S.arm===k)removeRole(b.dataset.r);else{S.arm=k;render()}}
  else if(a==='staff-del'){
    const id=b.dataset.id;
    if(S.arm===id){S.staff=S.staff.filter(p=>p.id!==id);S.arm=null;touch('staff')}else S.arm=id;
    render();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#picker').hidden)closePicker();if(e.key==='Enter'&&e.target.id==='newrole'&&S.day){e.preventDefault();addRole()}
  if(e.key==='Enter'&&e.target.id==='butnew'){e.preventDefault();const b=$('[data-act=butv-new]');if(b)b.click()}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='butname')e.target.blur()});
document.addEventListener('input',e=>{
  if(e.target.id==='staffpaste'){S.pasteText=e.target.value;return}
  if(e.target.id==='newrole'){S.roleText=e.target.value;return}
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='occupied'){const n=Math.max(0,parseInt(e.target.value,10)||0);S.day.fc=Object.assign({},S.day.fc,{occupied:n,pct:Math.round(n/SELLABLE.length*100)});S.day.fcAuto=false;touch('d-'+S.date)}
  else if(f==='adult'||f==='child'||f==='infant'||f==='show'||f==='project'){S.day[f]=e.target.value;if(f!=='show'&&f!=='project')S.day.fcAuto=false;if(f==='adult'||f==='child'){const t=$('#totalguests');if(t)t.textContent=(+S.day.adult||0)+(+S.day.child||0)}touch('d-'+S.date)}
  else if(f==='mv'){const k=e.target.dataset.k,v=e.target.dataset.v,pl=ensurePlan(S.pdate),r=k==='mv'?pl.mv[+v]:pl[k][v];if(r){r[e.target.dataset.p]=e.target.value;touch('p-'+S.pdate)}}
  else if(f==='gst'){ensureG(e.target.dataset.v)[e.target.dataset.p]=e.target.value===''?'':Math.max(0,parseInt(e.target.value,10)||0);S.dirty=true;touch('d-'+S.date)}
  else if(f==='gtx'){ensureG(e.target.dataset.v)[e.target.dataset.p]=e.target.value;S.dirty=true;touch('d-'+S.date);
    if(e.target.dataset.p==='butler'){const c=$('#vbutlerc');if(c)c.innerHTML=butlerContact(e.target.value)}}
  else if(f==='grem'){ensureG(e.target.dataset.v).rem=e.target.value;S.dirty=true;touch('d-'+S.date)}
  else if(f==='durow'){const r=DUROWS.find(x=>x.id===e.target.dataset.v);if(r){r.label=e.target.value.trim()||'DAY USE';LABEL[r.id]=r.label;buildSections();S.dirty=true;touch('layout')}}
  else if(f==='sname'||f==='sphone'){
    const p=S.staff.find(x=>x.id===e.target.dataset.id);if(!p)return;
    p[f==='sname'?'name':'phone']=e.target.value;touch('staff');
  }
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;
  if(t.id==='datepick'){if(t.value)setDate(t.value);return}
  if(t.id==='pdatepick'){if(t.value){S.pdate=t.value;loadPlan(S.pdate).then(render);render()}return}
  if(t.id==='bkfile'){const fl=t.files&&t.files[0];t.value='';if(fl)restoreBackup(fl);return}
  if(t.id==='kvmfile'){const fl=t.files&&t.files[0];t.value='';if(fl)importFile(fl);return}
  if(t.id==='pasterank'){S.pasteRank=t.value;const b=$('#staffpaste');if(b)S.pasteText=b.value;return}
  if(f==='srank'&&!S.day){const p=S.staff.find(x=>x.id===t.dataset.id);if(p){p.role=t.value;touch('staff');render()}return}
  if(!f||!S.day)return;
  if(f==='occupied'){render();return}
  if(f==='butname'){renameButler(t.dataset.k,t.value.trim().replace(/\s+/g,' '));return}
  if(f==='sphone'&&S.tab==='but'){render();return}
  if(f==='butadd'){if(!t.value)return;const x=butGroup(t.dataset.k);if(!x||!x.name){t.value='';toast('Type the butler\'s name first');return}setButler(t.value,x.name);return}
  if(f==='mvadd'){
    if(!t.value)return;const p=ensurePlan(S.pdate);
    p[t.dataset.k][t.value]=t.dataset.k==='dep'?{co:'',bag:'',out:'',note:'',ad:0,ch:0}:{ready:'',eta:'',note:'',ad:0,ch:0};
    touch('p-'+S.pdate);render();return;
  }
  if(f==='mvsel'){const m=ensurePlan(S.pdate).mv[+t.dataset.v];if(m){m[t.dataset.p]=t.value;touch('p-'+S.pdate);render()}return}
  if(f==='vsec'){const id=t.dataset.v,n=+t.value;if(n===origSec(id))delete LAYOUT[id];else LAYOUT[id]=n;buildSections();touch('layout');S.dirty=true;closePicker();toast('Moved to Section '+String(n).padStart(2,'0'));return}
  if(f==='supsec'){const sec=secOfN(t.dataset.sec);if(sec){sec.villas.forEach(v=>{if(t.value)S.day.sup[v.id]=t.value;else delete S.day.sup[v.id]});touch('d-'+S.date);render()}return}
  if(f==='srank'){const p=S.staff.find(x=>x.id===t.dataset.id);if(p){p.role=t.value;S.staffSaved=true;touch('staff');render()}return}
  if(f==='secstaff'){const n=t.dataset.sec;if(t.value)S.day.sec[n]=t.value;else delete S.day.sec[n];touch('d-'+S.date);render()}
  else if(f==='dutyadd'){if(t.value){S.day.duty.push(t.value);touch('d-'+S.date);render()}}
});

/* colour theme: light or dark. until someone taps the button it follows the phone's setting; a tap is kept on this device only (not in backups).
   icons: Sun03 and Moon02 from Hugeicons free icons, MIT License, Copyright (c) 2025 Hugeicons */
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 12C17 14.7614 14.7614 17 12 17C9.23858 17 7 14.7614 7 12C7 9.23858 9.23858 7 12 7C14.7614 7 17 9.23858 17 12Z" stroke="currentColor" stroke-width="1.5"/><path d="M12 2V3.5M12 20.5V22M19.0708 19.0713L18.0101 18.0106M5.98926 5.98926L4.9286 4.9286M22 12H20.5M3.5 12H2M19.0713 4.92871L18.0106 5.98937M5.98975 18.0107L4.92909 19.0714" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.5 14.0784C20.3003 14.7189 18.9301 15.0821 17.4751 15.0821C12.7491 15.0821 8.91792 11.2509 8.91792 6.52485C8.91792 5.06986 9.28105 3.69968 9.92163 2.5C5.66765 3.49698 2.5 7.31513 2.5 11.8731C2.5 17.1899 6.8101 21.5 12.1269 21.5C16.6849 21.5 20.503 18.3324 21.5 14.0784Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>';
const darkQ=matchMedia('(prefers-color-scheme: dark)');
const curTheme=()=>{const t=document.documentElement.dataset.theme;return t==='light'||t==='dark'?t:(darkQ.matches?'dark':'light')};
function applyTheme(t,keep){
  document.documentElement.dataset.theme=t;
  if(keep)try{localStorage.setItem('vsb:theme',t)}catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#0A1A1D':'#EDF3F3';
  /* the button shows the mode a tap switches to */
  const b=$('#themebtn');if(b){b.innerHTML=t==='dark'?ICON_SUN:ICON_MOON;b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');b.title=b.getAttribute('aria-label')}
}
applyTheme(curTheme());
darkQ.addEventListener('change',()=>{let kept=null;try{kept=localStorage.getItem('vsb:theme')}catch(e){}if(!kept)applyTheme(darkQ.matches?'dark':'light')});
boot();
/* the next arrival on the Supervisor allocation tab moves on as the day goes; redraw each minute unless someone is typing or a window is open */
setInterval(()=>{const a=document.activeElement;if(S.tab==='sup'&&S.day&&$('#picker').hidden&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))render()},60000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
